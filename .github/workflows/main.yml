name: Daily Stock Scanner

on:
  schedule:
    # રોજ બપોરે 3:10 વાગ્યે (ભારતીય સમય મુજબ) સોમથી શુક્રવાર રન થશે
    - cron: '40 9 * * 1-5' 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Libraries
      run: pip install -r requirements.txt

    - name: Run Python Scanner
      run: python scanner.py

    - name: Save Excel File back to GitHub
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add Master_Stock_Tracker_With_History.xlsx
        git commit -m "Automated Daily Scan Update" || echo "No changes"
        git push
